<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullGraph Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Modular CSS Links -->
    <link rel="stylesheet" href="tutorial-css/theme.css">
    <link rel="stylesheet" href="tutorial-css/layout.css">
    <link rel="stylesheet" href="tutorial-css/tabs.css">
    <link rel="stylesheet" href="tutorial-css/editor.css">

    <!-- Icons for IDE look -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>
<body>

<div class="ide-root">
    <!-- LEFT MOST: Activity Bar -->
    <div class="activity-bar">
        <div class="activity-top">
            <div class="icon-btn active"><i data-lucide="files"></i></div>
<!--            <div class="icon-btn"><i data-lucide="search"></i></div>-->
<!--            <div class="icon-btn"><i data-lucide="git-merge"></i></div>-->
<!--            <div class="icon-btn"><i data-lucide="play"></i></div>-->
        </div>
        <div class="activity-bottom">
<!--            <div class="icon-btn"><i data-lucide="settings"></i></div>-->
        </div>
    </div>

    <!-- MAIN WORKSPACE: Split Panes -->
    <div class="workspace">

        <!-- PANE 1: Editor -->
        <div class="pane pane-left">
            <div class="pane-header">
                <div class="tab-group">
                    <button class="tab active" id="tab-ts">
                        <i data-lucide="file-code-2" class="tab-icon ts-icon"></i> main.ts
                    </button>
                    <button class="tab" id="tab-js">
                        <i data-lucide="file-json" class="tab-icon js-icon"></i> main.js
                    </button>
                    <button class="tab" id="tab-compiled">
                        <i data-lucide="file-box" class="tab-icon"></i> compiled.js <span class="badge">R/O</span>
                    </button>
                </div>
            </div>
            <div class="editor-wrapper" id="editor-container"></div>
        </div>

        <!-- SPLITTER (Visual Only) -->
        <div class="pane-resizer"></div>

        <!-- PANE 2: Preview -->
        <div class="pane pane-right">
            <div class="pane-header header-right">
                <div class="tab-group">
                    <div class="tab preview-tab active">
                        <i data-lucide="monitor-play" class="tab-icon accent-icon"></i> Live WebGPU Output
                    </div>
                </div>
                <div class="header-actions">
                    <button id="btn-restart" class="action-btn">
                        <i data-lucide="rotate-cw"></i> Restart
                    </button>
                </div>
            </div>
            <div class="preview-wrapper" id="preview-container">
                <!-- Iframe injected here -->
                <div id="error-log"></div>
            </div>
        </div>

    </div>

    <!-- BOTTOM: Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-item"><i data-lucide="x-circle" class="error-icon"></i> 0</span>
            <span class="status-item"><i data-lucide="alert-triangle" class="warn-icon"></i> 0</span>
            <span class="status-item">NullGraph v1.0.0</span>
        </div>
        <div class="status-right">
            <span class="status-item">Ln 1, Col 1</span>
            <span class="status-item">Spaces: 4</span>
            <span class="status-item">UTF-8</span>
            <span class="status-item">TypeScript</span>
        </div>
    </div>
</div>

<script>
    // Initialize Lucide Icons
    lucide.createIcons();
</script>
<script type="module" src="tutorial.js"></script>
</body>
</html>
